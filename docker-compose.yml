version: '3.8'

services:
  api:
    build: .
    container_name: promptshield-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  dashboard:
    image: python:3.10-slim
    container_name: promptshield-dashboard
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    command: >
      bash -c "pip install streamlit requests groq python-dotenv --quiet &&
               streamlit run demo.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      - api
    env_file:
      - .env
    restart: unless-stopped